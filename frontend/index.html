<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercedes-Benz Exhibition Quiz</title>
    <style>
      /* Mercedes-Benz Corporate Fonts */
      @font-face {
        font-family: 'MBCorpoSText';
        src: url('/fonts/MBCorpoSText/MBCorpoSText-Regular-Web.woff2') format('woff2'),
             url('/fonts/MBCorpoSText/MBCorpoSText-Regular-Web.woff') format('woff');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'MBCorpoSText';
        src: url('/fonts/MBCorpoSText/MBCorpoSText-Bold-Web.woff2') format('woff2'),
             url('/fonts/MBCorpoSText/MBCorpoSText-Bold-Web.woff') format('woff');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'MBCorpoSTitle';
        src: url('/fonts/MBCorpoSTitle/MBCorpoSTitle-Bold-Web.woff2') format('woff2'),
             url('/fonts/MBCorpoSTitle/MBCorpoSTitle-Bold-Web.woff') format('woff');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'MBCorpoSTitle';
        src: url('/fonts/MBCorpoSTitle/MBCorpoSTitle-Regular-Web.woff2') format('woff2'),
             url('/fonts/MBCorpoSTitle/MBCorpoSTitle-Regular-Web.woff') format('woff');
        font-weight: 400;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'MBCorpoSText', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: #ffffff;
        color: #000000;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      #root {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      h1, h2, h3, h4 {
        font-family: 'MBCorpoSTitle', 'MBCorpoSText', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Slide Layout & Header */
      .slide-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 2rem;
        background: transparent;
        position: relative;
        z-index: 10;
      }
      .mb-logo {
        height: 60px;
        width: auto;
      }

      .slide-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
        text-align: center;
      }

      /* Buttons matching Mercedes-Benz Slide Templates */
      .mb-btn {
        background: #1CA0FF;
        color: #ffffff;
        border: none;
        padding: 1.1rem 2.5rem;
        font-family: 'MBCorpoSTitle', sans-serif;
        font-size: 1.4rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        border-radius: 0px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .mb-btn:hover {
        background: #008be5;
        transform: translateY(-2px);
      }
      .mb-btn:active {
        transform: translateY(0);
      }
      .mb-btn:disabled {
        background: #cccccc;
        cursor: not-allowed;
        transform: none;
      }
      .mb-btn-secondary {
        background: #000000;
        color: #ffffff;
      }
      .mb-btn-secondary:hover {
        background: #222222;
      }
      .mb-btn-outline {
        background: transparent;
        color: #000000;
        border: 2px solid #000000;
      }
      .mb-btn-outline:hover {
        background: #000000;
        color: #ffffff;
      }

      /* Option Buttons - Color Scheme: Blue = Correct/Selected, Gray = Incorrect/Default */
      .mb-option-btn {
        background: #f5f5f5;
        border: 2px solid #e5e5e5;
        color: #000000;
        padding: 1.25rem 1.5rem;
        font-family: 'MBCorpoSText', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        width: 100%;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 0px;
        transition: all 0.15s ease;
      }
      .mb-option-btn:hover {
        border-color: #1CA0FF;
        background: #eef8ff;
      }
      .mb-option-btn.selected {
        background: #1CA0FF;
        color: #ffffff;
        border-color: #1CA0FF;
      }
      .mb-option-btn.correct {
        background: #1CA0FF;
        color: #ffffff;
        border-color: #1CA0FF;
      }
      .mb-option-btn.incorrect {
        background: #737373;
        color: #ffffff;
        border-color: #737373;
      }

      /* Designer Mobile Option Buttons (Frame 2 - Frage 1.png & Frame 2 - Frage 2 - richtige Antwort.png) */
      .mb-designer-option {
        display: flex;
        align-items: stretch;
        border: 2px solid #000000;
        width: 100%;
        margin-bottom: 1rem;
        background: #ffffff;
        cursor: pointer;
        height: 60px;
        text-align: left;
        transition: all 0.15s ease;
        user-select: none;
      }
      .mb-designer-option .letter-box {
        width: 55px;
        min-width: 55px;
        background: #1CA0FF;
        color: #ffffff;
        font-family: 'MBCorpoSTitle', sans-serif;
        font-size: 1.6rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 2px solid #000000;
      }
      .mb-designer-option .text-box {
        flex: 1;
        padding: 0 1.25rem;
        display: flex;
        align-items: center;
        font-family: 'MBCorpoSText', sans-serif;
        font-size: 1.1rem;
        font-weight: bold;
        color: #000000;
        background: #ffffff;
      }
      .mb-designer-option.selected .letter-box {
        background: #ffffff;
        color: #1CA0FF;
      }
      .mb-designer-option.selected .text-box {
        background: #1CA0FF;
        color: #ffffff;
      }
      .mb-designer-option.incorrect .letter-box {
        background: #ffffff;
        color: #737373;
      }
      .mb-designer-option.incorrect .text-box {
        background: #737373;
        color: #ffffff;
      }

      .secret-reset-area {
        position: fixed;
        top: 0;
        right: 0;
        width: 120px;
        height: 120px;
        z-index: 9999;
        cursor: default;
        opacity: 0;
        background: transparent;
      }

      /* Prominent Overlay Graphic for Next-Question Countdown */
      .mb-timer-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: #ffffff;
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .mb-circular-timer-container {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .mb-circular-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .mb-circular-bg-ring {
        fill: none;
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 10;
      }

      .mb-circular-progress-ring {
        fill: none;
        stroke: #1CA0FF;
        stroke-width: 10;
        stroke-linecap: square;
        transition: stroke-dashoffset 1s linear;
      }

      .mb-circular-number {
        position: absolute;
        font-family: 'MBCorpoSTitle', sans-serif;
        font-size: 4rem;
        font-weight: bold;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
